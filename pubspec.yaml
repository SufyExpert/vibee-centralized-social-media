name: vibee
description: "Multi-platform social media aggregator — YouTube, Reddit, and News in one feed."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Networking
  http: ^1.2.0
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
